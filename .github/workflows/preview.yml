name: 🔍 Preview

on:
  pull_request:
    paths:
      - "**.astro"
      - "**.ts"
      - bun.lock
      - .github/workflows/preview.yml
      - "!**.test.ts"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: 🚀 Deploy to Preview
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-slim
    environment:
      name: Preview
      deployment: false
    timeout-minutes: 3
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up bun with cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 👾 Create meta file
        run: cp meta.example.json meta.json

      - name: 🛠️ Build
        run: bun run build

      - name: ⛅️ Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.160.0
          command: versions upload --name=${{ github.event.repository.name }} --compatibility-date="$(date +%Y-%m-%d)" --assets=./dist --preview-alias=preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  analyze-performance:
    name: 🔦 Analyze Performance
    permissions:
      pull-requests: write
    needs: deploy
    runs-on: Ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: 🔦 Analyze performance
        id: lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: ${{ needs.deploy.outputs.url }}
          runs: 3

      - name: 📊 Arrange summary
        uses: actions/github-script@v9.0.0
        id: summary
        with:
          result-encoding: string
          script: |
            const manifest = JSON.parse(require("node:fs").readFileSync(`${process.env.results_path}/manifest.json`, "utf8"));
            const summary = manifest.reduce((sum, { summary }) => {
              for (const label in summary) sum[label] = (sum[label] || 0) + summary[label];
              return sum;
            }, {});
            const results = Object.entries(summary).map(([label, percentage]) => {
              const score = Math.round(percentage / manifest.length * 100);
              const icon = score >= 90 ? "🟢" : score >= 50 ? "🟧" : "🔺";
              return { label, score: `${icon} ${score}` };
            });
            const labels = `| ${results.map(({ label }) => label).join(" | ")} |`;
            const scores = `| ${results.map(({ score }) => score).join(" | ")} |`;
            return `${labels}\n| ${results.map(() => ":-:").join(" | ")} |\n${scores}`;
        env:
          results_path: ${{ steps.lighthouse.outputs.resultsPath }}

      - name: 💬 Comment result
        uses: mshick/add-pr-comment@v3.12.0
        with:
          message: |
            ## 🔦 Lighthouse Result

            ${{ steps.summary.outputs.result }}

            <details><summary>📊 Score Scale</summary>

            |  Fail   | Average  |   Pass    |
            | :-----: | :------: | :-------: |
            | 🔺 0-49 | 🟧 50-89 | 🟢 90-100 |

            </details>
          message-id: lighthouse

  astrobook:
    name: 📔 Deploy Astrobook
    permissions:
      contents: read
      deployments: write
    runs-on: Ubuntu-Slim
    environment:
      name: Preview
      deployment: false
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up bun with cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 👾 Create meta file
        run: cp meta.example.json meta.json

      - name: 🛠️ Build
        run: bun run build:astrobook

      - name: ⛅️ Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.160.0
          command: versions upload --name=${{ github.event.repository.name }} --compatibility-date="$(date +%Y-%m-%d)" --assets=./dist --preview-alias=astrobook
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
