name: 🏷️ Label Past Pull Requests

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-past-pr:
    name: 🏷️ Label Past Pull Requests
    permissions:
      pull-requests: write
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.merged }}
    runs-on: ubuntu-slim
    timeout-minutes: 1

    steps:
      - name: 🏷️ Add label to past Pull Requests
        uses: 5ouma/utils/label-past-pr@54b168c10fa69b079dd1fa90a94258f07b9cdca2 # v0.13.0
        with:
          label: 🕰️ Past Dependencies
