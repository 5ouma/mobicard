name: 🎽 CI

on:
  push:
    branches:
      - main
    paths:
      - "**.astro"
      - "**.ts"
      - "**.snap"
      - bun.lock
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - "**.astro"
      - "**.ts"
      - "**.snap"
      - bun.lock
      - .github/workflows/ci.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  astro-check:
    name: 🚀 Astro Check
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up Bun with cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 👾 Create meta file
        run: cp meta.example.json meta.json

      - name: 🚀 Astro check
        run: bun run check:astro

  biome-check:
    name: 🏞️ Biome Check
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up Bun with Cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 🏞️ Biome check
        run: bun run check:biome

  test:
    name: 🧪 Test
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    environment:
      name: CI
      deployment: false
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up Bun with cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 👾 Create meta file
        run: cp meta.example.json meta.json

      - name: 🧪 Run tests
        run: bun run test:cov

      - name: ☂️ Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: ☂️ Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  build-check:
    name: 🛠️ Build Check
    permissions:
      contents: read
    runs-on: Ubuntu-Slim
    timeout-minutes: 3

    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🍞 Set up Bun with cache
        uses: 5ouma/utils/setup-bun-with-cache@v0.13.1

      - name: 👾 Create meta file
        run: cp meta.example.json meta.json

      - name: 🛠️ Build check
        run: bun run build
